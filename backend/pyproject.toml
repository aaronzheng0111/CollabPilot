[project]
name = "collabpilot"
version = "0.1.0"
description = "CollabPilot agent runtime for AI creator collaboration workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "openai>=1.60.0,<2",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=13.9.0,<15",
    "sqlalchemy>=2.0.36,<3",
    "structlog>=24.4.0,<26",
    "typer>=0.15.0,<1",
    "uvicorn>=0.34.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.25.0,<1",
]
ui = [
    "streamlit>=1.50.0,<2",
]

[project.scripts]
agent = "collabpilot.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collabpilot"]

[tool.uv.extra-build-dependencies]
collabpilot = ["hatchling>=1.27.0"]

[tool.pytest.ini_options]
# `eval` cases call DeepSeek and are skipped by default: `uv run pytest -m eval`.
addopts = "-q -m 'not eval'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: calls DeepSeek and compares with load_oracle(); not part of the unit run",
]
